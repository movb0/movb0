<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8E1"/>
      <stop offset="1" stop-color="#FFEBB8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F9C6D6"/>
      <stop offset="1" stop-color="#E8789F"/>
    </linearGradient>
    <path id="heart" d="M0 -6 C-10 -18 -26 -4 0 14 C26 -4 10 -18 0 -6Z"/>
    <path id="spark" d="M0 -9 L2.5 -2.5 L9 0 L2.5 2.5 L0 9 L-2.5 2.5 L-9 0 L-2.5 -2.5Z"/>
  </defs>
  <style>
    .float { animation: float 6s ease-in-out infinite; }
    .f2 { animation-duration: 7.5s; animation-delay: -2s; }
    .f3 { animation-duration: 5s; animation-delay: -1s; }
    .f4 { animation-duration: 8s; animation-delay: -4s; }
    .twinkle { animation: twinkle 3s ease-in-out infinite; }
    .t2 { animation-delay: -1s; }
    .t3 { animation-delay: -2s; }
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 52px; font-weight: bold; fill: #C94F7C; }
    .sub { font-family: Georgia, 'Times New Roman', serif; font-size: 22px; font-style: italic; fill: #6B3E4E; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  </style>

  <rect width="900" height="260" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="897" height="257" rx="22.5" fill="none" stroke="#F4A6C0" stroke-width="3"/>

  <circle cx="800" cy="40" r="90" fill="#F9C6D6" opacity=".35"/>
  <circle cx="70" cy="240" r="70" fill="#F4A6C0" opacity=".25"/>

  <g class="float"><use href="#heart" x="790" y="190" fill="#F4A6C0"/></g>
  <g class="float f2"><use href="#heart" x="720" y="95" fill="#E8789F" opacity=".7" transform="scale(.7)" /></g>
  <g class="float f3"><use href="#heart" x="640" y="215" fill="#F9C6D6"/></g>
  <g class="float f4"><use href="#heart" x="85" y="55" fill="#F9C6D6"/></g>

  <g class="twinkle"><use href="#spark" x="840" y="110" fill="#E8789F"/></g>
  <g class="twinkle t2"><use href="#spark" x="590" y="60" fill="#F4A6C0"/></g>
  <g class="twinkle t3"><use href="#spark" x="130" y="215" fill="#E8789F"/></g>
  <g class="twinkle t2"><use href="#spark" x="480" y="225" fill="#F9C6D6"/></g>

  <text x="60" y="125" class="title">Hi, I'm [Your Name]</text>
  <rect x="62" y="145" width="260" height="6" rx="3" fill="url(#bar)"/>
  <text x="60" y="190" class="sub">Aspiring software engineer · looking for an internship</text>
</svg>
