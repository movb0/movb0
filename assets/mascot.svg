<svg viewBox="0 0 280 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute kitty mascot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <g id="fl">
      <circle cy="-6" r="4.5" fill="#F4A6C0"/>
      <circle cy="-6" r="4.5" fill="#F4A6C0" transform="rotate(72)"/>
      <circle cy="-6" r="4.5" fill="#F4A6C0" transform="rotate(144)"/>
      <circle cy="-6" r="4.5" fill="#F4A6C0" transform="rotate(216)"/>
      <circle cy="-6" r="4.5" fill="#F4A6C0" transform="rotate(288)"/>
      <circle r="3" fill="#FFE9A8"/>
    </g>
  </defs>
  <style>
    .bob { animation: bob 3s ease-in-out infinite; }
    .blink { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
    .look { animation: look 6s ease-in-out infinite; }
    .fl { animation: drift 5s ease-in-out infinite; }
    .f2 { animation-duration: 6.5s; animation-delay: -2s; }
    .f3 { animation-duration: 4.5s; animation-delay: -1s; }
    .f4 { animation-duration: 7s; animation-delay: -3s; }
    .say { font-family: Georgia, 'Times New Roman', serif; font-size: 15px; fill: #6B3E4E; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes look { 0%,40%,100% { transform: translateX(0); } 50%,70% { transform: translateX(5px); } 80% { transform: translateX(-4px); } }
    @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  </style>

  <g class="fl"><use href="#fl" x="30" y="150"/></g>
  <g class="fl f2"><use href="#fl" x="250" y="170"/></g>
  <g class="fl f3"><use href="#fl" x="245" y="70"/></g>
  <g class="fl f4"><use href="#fl" x="38" y="60"/></g>

  <g class="bob">
    <path d="M70 70 L82 22 L116 52Z M190 70 L178 22 L144 52Z" fill="#F4A6C0" stroke="#E8789F" stroke-width="5" stroke-linejoin="round"/>
    <path d="M82 56 L86 36 L102 50Z M178 56 L174 36 L158 50Z" fill="#FFE9A8"/>
    <ellipse cx="130" cy="120" rx="84" ry="68" fill="#F9C6D6" stroke="#E8789F" stroke-width="5"/>
    <ellipse cx="130" cy="142" rx="46" ry="28" fill="#FFF4D6"/>
    <g class="blink">
      <circle cx="98" cy="112" r="16" fill="#fff" stroke="#6B3E4E" stroke-width="3"/>
      <circle cx="162" cy="112" r="16" fill="#fff" stroke="#6B3E4E" stroke-width="3"/>
      <g class="look">
        <circle cx="98" cy="112" r="7.5" fill="#6B3E4E"/>
        <circle cx="162" cy="112" r="7.5" fill="#6B3E4E"/>
      </g>
    </g>
    <ellipse cx="72" cy="138" rx="12" ry="7" fill="#E8789F" opacity=".45"/>
    <ellipse cx="188" cy="138" rx="12" ry="7" fill="#E8789F" opacity=".45"/>
    <path d="M118 140 Q124 150 130 140 Q136 150 142 140" fill="none" stroke="#6B3E4E" stroke-width="4" stroke-linecap="round"/>
    <path d="M130 124 l-5 -6 h10z" fill="#E8789F"/>
    <text x="130" y="205" text-anchor="middle" class="say">hi hi! welcome to my page ✿</text>
  </g>
</svg>
